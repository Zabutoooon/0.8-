<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0.8倍電卓</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 15px;
    font-family: sans-serif;
    background: #f4f6f8;
    color: #222;
}

.calculator {
    max-width: 500px;
    margin: auto;
    padding: 25px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    margin-top: 0;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 15px;
    font-size: 28px;
    text-align: right;
    border: 2px solid #ddd;
    border-radius: 10px;
    outline: none;
}

input:focus {
    border-color: #555;
}

.result {
    margin-top: 25px;
    padding: 20px;
    background: #f0f2f4;
    border-radius: 12px;
    text-align: center;
}

.result-title {
    font-size: 14px;
    color: #666;
}

#result {
    margin-top: 5px;
    font-size: 42px;
    font-weight: bold;
    word-break: break-all;
}

button {
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.clear {
    width: 100%;
    margin-top: 15px;
    padding: 13px;
    font-size: 18px;
    background: #ddd;
}

.history {
    margin-top: 30px;
}

.history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.history-header h2 {
    margin: 0;
    font-size: 21px;
}

.delete-all {
    padding: 7px 10px;
    background: #ddd;
    font-size: 13px;
}

#historyList {
    margin-top: 12px;
}

.history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 5px;
    border-bottom: 1px solid #ddd;
}

.calculation {
    font-size: 18px;
}

.delete-item {
    padding: 5px 9px;
    background: #eee;
    font-size: 14px;
}

.empty-history {
    text-align: center;
    color: #888;
    padding: 20px 0;
}
</style>
</head>

<body>

<div class="calculator">

    <h1>0.8倍電卓</h1>

    <label for="number">数値</label>

    <input
        id="number"
        type="number"
        inputmode="decimal"
        step="any"
        placeholder="数値を入力"
        autocomplete="off"
    >

    <div class="result">
        <div class="result-title">計算結果</div>
        <div id="result">—</div>
    </div>

    <button class="clear" id="clear">
        クリア
    </button>

    <div class="history">

        <div class="history-header">
            <h2>計算履歴</h2>

            <button class="delete-all" id="deleteAll">
                履歴を全消去
            </button>
        </div>

        <div id="historyList"></div>

    </div>

</div>

<script>

const numberInput = document.getElementById("number");
const result = document.getElementById("result");
const clearButton = document.getElementById("clear");
const historyList = document.getElementById("historyList");
const deleteAllButton = document.getElementById("deleteAll");

const MULTIPLIER = 0.8;

let history =
    JSON.parse(localStorage.getItem("calculatorHistory")) || [];


// 数値を見やすく表示する
function formatNumber(number) {

    return Number(
        number.toPrecision(15)
    ).toString();

}


// 計算
function calculate() {

    const input = numberInput.value;

    if (input === "") {
        result.textContent = "—";
        return;
    }

    const number = Number(input);
    const answer = number * MULTIPLIER;

    const formattedAnswer = formatNumber(answer);

    result.textContent = formattedAnswer;

}


// 履歴に追加
function addHistory(input, answer) {

    history.unshift({
        input: input,
        answer: answer
    });

    // 履歴が増えすぎないように100件まで
    if (history.length > 100) {
        history = history.slice(0, 100);
    }

    saveHistory();
    displayHistory();

}


// 履歴を保存
function saveHistory() {

    localStorage.setItem(
        "calculatorHistory",
        JSON.stringify(history)
    );

}


// 履歴を表示
function displayHistory() {

    historyList.innerHTML = "";

    if (history.length === 0) {

        historyList.innerHTML =
            '<div class="empty-history">履歴はありません</div>';

        return;
    }

    history.forEach(function(item, index) {

        const historyItem =
            document.createElement("div");

        historyItem.className = "history-item";

        const calculation =
            document.createElement("span");

        calculation.className = "calculation";

        calculation.textContent =
            item.input + " × 0.8 = " + item.answer;

        const deleteButton =
            document.createElement("button");

        deleteButton.className = "delete-item";
        deleteButton.textContent = "×";

        deleteButton.addEventListener("click", function() {

            history.splice(index, 1);

            saveHistory();
            displayHistory();

        });

        historyItem.appendChild(calculation);
        historyItem.appendChild(deleteButton);

        historyList.appendChild(historyItem);

    });

}


// 入力時に自動計算
numberInput.addEventListener("input", calculate);


// Enterキーで履歴に追加
numberInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        const input = numberInput.value;

        if (input === "") {
            return;
        }

        const number = Number(input);
        const answer = number * MULTIPLIER;

        addHistory(
            input,
            formatNumber(answer)
        );

    }

});


// クリア
clearButton.addEventListener("click", function() {

    numberInput.value = "";
    result.textContent = "—";

    numberInput.focus();

});


// 履歴を全消去
deleteAllButton.addEventListener("click", function() {

    if (history.length === 0) {
        return;
    }

    if (confirm("計算履歴をすべて削除しますか？")) {

        history = [];

        saveHistory();
        displayHistory();

    }

});


// 起動時に履歴を表示
displayHistory();

</script>

</body>
</html>
